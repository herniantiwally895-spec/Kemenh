<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pelayanan Publik | Kementerian Haji & Umrah</title>
    <link rel="stylesheet" href="kemenhaj.css">
    <!-- Menggunakan Font Montserrat untuk kesan modern -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <img src="kemenag.png" alt="Logo Instansi" class="logo">
            <h1>Sistem Informasi Pelayanan Publik</h1>
            <p>Kantor Kementerian Haji dan Umrah</p>
        </header>

        <main>
            <section class="qr-section">
                <h3>Scan QR Code di Bawah Ini</h3>
                <div id="qrcode">
                    <!-- Anda bisa mengganti source gambar ini dengan QR Code asli dari link website Anda -->
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=URL_WEBSITE_ANDA" alt="QR Code Akses">
                </div>
                <p class="instruction">Akses formulir lebih cepat melalui pemindaian perangkat Anda.</p>
            </section>

            <section class="action-buttons">
                <a href="https://forms.gle/AxUuS98aQmsgAbT49" target="_blank" class="btn btn-primary">
                    <span class="icon">📝</span> Isi Formulir Pelayanan
                </a>
                <a href="https://forms.gle/w1JjLnEfkr1LsocV7" target="_blank" class="btn btn-secondary">
                    <span class="icon">⭐</span> Survei Kepuasan Masyarakat
                </a>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Dokumentasi Kegiatan Magang - Informatika</p>
        </footer>
    </div>
</body>
</html>
